name: lets_eat
description: "An app for finding places to eat."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.14.0
  geolocator: ^14.0.2
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0
  build_runner: ^2.10.3
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
